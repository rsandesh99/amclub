# Phase 8 §2(a) search load test, re-runnable by hand (never on a push or PR: Actions minutes are metered).
# Read-only (catalog search), so it may target production. Checkout / RFQ load needs a PREVIEW and the prep /
# cleanup scripts (docs/qa/QA_CHECKLIST.md §10); production refuses simulated checkout (ADR 023).
name: Load test (search)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployment to load (read-only search)'
        required: true
        default: 'https://amclub-web.vercel.app'

# Read-only token (audit M26).
permissions:
  contents: read

jobs:
  search:
    name: k6 · search p95 < 800 ms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install k6
        # Pinned version AND checksum (k6-v0.54.0-checksums.txt); bump both together.
        run: |
          curl -fsSL -o k6.tar.gz https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          echo "c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589  k6.tar.gz" | sha256sum -c -
          tar xzf k6.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: 500 concurrent searches (ramp 30 s, hold 60 s)
        # The input reaches the shell through env, never interpolated into the script.
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: k6 run --summary-trend-stats "avg,med,p(90),p(95),p(99),max" -e BASE_URL="$BASE_URL" loadtest/k6-search.js
