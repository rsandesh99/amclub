# H1 (S3.3 prompt; ADR-014 / ADR-015) — the money and authz rigs run on every PR
# against a DISPOSABLE Supabase stack started on the runner (`supabase start`),
# built from this commit's schema (db:bootstrap = every migration + RLS) plus the
# seed, with the app in simulate-payment mode (no Razorpay keys). Nothing here
# ever touches production. The CI database carries the staged Mart migrations
# (production has them too since the 2026-09-24 launch); staged-column leaks are
# still caught offline by `mart:static` in the main CI job. Mart itself is proven
# on the production-flags server (:3001, agents + Mart on); its kill switch on
# the flag-off server (:3000).
name: Money rigs

# Minutes economy: once per PR when it is ready for review (drafts run nothing),
# not again on the merge push to master; workflow_dispatch runs it by hand.
on:
  pull_request:
    branches: [master, main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: money-rigs-${{ github.ref }}
  cancel-in-progress: true

# Read-only token (audit M26): the rigs write nothing to the repo or the PR (artifacts use the runtime token).
permissions:
  contents: read

jobs:
  rigs:
    name: Money rigs · disposable Supabase
    # Minutes economy: drafts run nothing; a PR runs once when it is marked ready (and on later pushes).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Rate limiting is part of what verify-authz proves (the admin limiter must
    # engage), so the app gets a real Redis behind an Upstash-compatible REST front.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      upstash:
        # Third-party image: pinned to the digest `latest` pointed at (2024-05-11); bump deliberately.
        image: hiett/serverless-redis-http:latest@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
        ports: ['8079:80']
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-upstash-token-disposable
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      BASE_URL: http://localhost:3000
      WEBHOOK_URL: http://localhost:3000/api/v1/webhooks/razorpay
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Throwaway values for the disposable stack only — not secrets.
      CRON_SECRET: ci-cron-secret-disposable
      RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret-disposable
      SEND_SMS_HOOK_SECRET: "v1,whsec_Y2ktc21zLWhvb2stc2VjcmV0LWRpc3Bvc2FibGUtMDAwMQ=="
      COLUMN_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci-upstash-token-disposable
      SENTRY_AUTH_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"
      # Experience v3 (PRD §7.9): this job runs the app with the v3 flags ON, so
      # the rigs exercise the new surfaces; the axe job keeps the production
      # default (off) and scans the v2 public pages.
      EXP_V3_SHELL: "on"
      EXP_V3_TRUST: "on"
      EXP_V3_PACKAGES: "on"
      EXP_V3_SEARCH: "on"
      EXP_V3_CHECKOUT: "on"
      EXP_V3_REQUIREMENTS: "on"
      EXP_V3_HOME: "on"
      EXP_V3_ONBOARDING: "on"
      EXP_V3_PARTNER: "on"
      EXP_V3_COMPARE: "on"
      EXP_V3_ORDERS: "on"
      EXP_V3_MOBILE: "on"
      EXP_V3_GUIDE: "on"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # Pinned: `latest` resolves through the unauthenticated GitHub API,
          # which rate-limits shared runner IPs ("Failed to resolve latest
          # Supabase CLI release: rate limit exceeded"). Bump deliberately.
          version: 2.117.0

      - name: Start the disposable Supabase stack
        run: |
          # ghcr.io throttles shared runner IPs ("toomanyrequests", 2026-09-23 — twice in a row, before any
          # rig ran). The CLI publishes the same images to public ECR and Docker Hub: retry each registry
          # with a backoff, then move on. A real start failure still fails the job after the last one.
          for reg in ghcr.io public.ecr.aws docker.io; do
            for attempt in 1 2; do
              echo "supabase start via $reg (attempt $attempt)"
              if SUPABASE_INTERNAL_IMAGE_REGISTRY="$reg" supabase start --workdir .github/supabase-ci -x studio,imgproxy,realtime,edge-runtime,logflare,vector; then exit 0; fi
              echo "::warning::supabase start failed via $reg (attempt $attempt)"
              supabase stop --workdir .github/supabase-ci --no-backup || true
              sleep $((attempt * 20))
            done
          done
          echo "::error::supabase start failed on every registry"
          exit 1

      - name: Export the local stack's URL and keys
        run: |
          supabase status --workdir .github/supabase-ci -o env > "$RUNNER_TEMP/sb.env"
          set -a; . "$RUNNER_TEMP/sb.env"; set +a
          for v in API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL; do
            if [ -z "${!v:-}" ]; then echo "supabase status did not report $v"; sed 's/=.*/=…/' "$RUNNER_TEMP/sb.env"; exit 1; fi
          done
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "DATABASE_URL=${DB_URL}"
            # verify-authz §10 signs its own delegated-token probes with the local stack's
            # secret. Deliberately NOT SUPABASE_JWT_SECRET: the app servers keep minting off.
            if [ -n "${JWT_SECRET:-}" ]; then echo "AUTHZ_JWT_SECRET=${JWT_SECRET}"; fi
          } >> "$GITHUB_ENV"

      - name: Schema (every migration + RLS) and seed
        run: |
          pnpm --filter @amclub/db db:bootstrap -- --url "$DATABASE_URL"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/supabase-ci/buckets.sql
          pnpm --filter @amclub/db db:seed
          # Production keeps the demo providers suspended; match it so the rigs'
          # exact fan-out counts only see the providers they create.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "update provider_profiles set status = 'suspended'"

      - name: Upstash-compatible REST front answers
        run: |
          # The same protocol @upstash/redis speaks: POST / with a JSON command array.
          for i in $(seq 1 30); do
            if curl -sf -X POST -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" -H "Content-Type: application/json" \
                 -d '["PING"]' "$UPSTASH_REDIS_REST_URL/" | grep -q PONG; then echo "upstash ok"; exit 0; fi
            sleep 2
          done
          echo "the Upstash REST front did not answer"
          curl -s -X POST -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" -d '["PING"]' "$UPSTASH_REDIS_REST_URL/" || true
          docker ps
          docker logs "$(docker ps -q --filter ancestor=hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150)" 2>&1 | tail -40 || true
          exit 1

      - name: Build and start the app (simulate payments)
        id: app
        run: |
          pnpm turbo run build --filter=@amclub/web
          cd apps/web
          nohup pnpm start > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/en; then echo "app up"; exit 0; fi
            sleep 2
          done
          tail -100 "$RUNNER_TEMP/next.log"
          exit 1

      - name: Authz (cross-tenant + admin boundary)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec tsx scripts/verify-authz.ts

      - name: Money loop (package order → payout, cancel refund, crons)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec tsx scripts/verify-money-loop.ts

      - name: Webhook replay never double-creates
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec tsx scripts/killtest-webhook-replay.ts

      - name: Dropped webhook is recovered by reconcile
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec tsx scripts/killtest-dropped-webhook.ts

      - name: Disputes (ADR-014 — paid-payout, earlier refund, reachability, window)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec tsx scripts/verify-phase7.ts

      - name: RFQ (ADR-015 GST-included, ADR-014 §7 duplicate order, E7 loss labels)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec tsx scripts/verify-rfq.ts

      - name: Experience v3 (PRD acceptance, one section per epic)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec tsx scripts/verify-experience.ts

      # Agent surfaces (S3.4, ADR 024) exist only with AGENT_ENABLED=true, and Mart only with MART_ENABLED=true. A
      # second server runs the SAME build with both on (:3001), as production does since 2026-09-24. Both switches are
      # read at runtime. Every rig above keeps proving the code default (both off) on :3000.
      - name: Start the production-flags app (port 3001 — agents + Mart on)
        id: agentapp
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/web
        env:
          AGENT_ENABLED: "true"
          MART_ENABLED: "true"
        run: |
          nohup pnpm start -p 3001 > "$RUNNER_TEMP/next-agent.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3001/en; then echo "agent app up"; exit 0; fi
            sleep 2
          done
          tail -100 "$RUNNER_TEMP/next-agent.log"
          exit 1

      - name: Demand pools (S3.4 / ADR 024 — agent on; flag-off inert)
        if: ${{ !cancelled() && steps.agentapp.outcome == 'success' }}
        working-directory: apps/web
        env:
          BASE_URL: http://localhost:3001
          FLAG_OFF_BASE_URL: http://localhost:3000
        run: pnpm exec tsx scripts/verify-pools.ts

      - name: Assistant home (E18 — agent on; /app/ai, /partner/ai, the launcher API)
        if: ${{ !cancelled() && steps.agentapp.outcome == 'success' }}
        working-directory: apps/web
        env:
          AGENT_BASE_URL: http://localhost:3001
        run: pnpm exec tsx scripts/verify-experience.ts --only=e18

      # The rigs above prove the server; these prove the screens. A real
      # Chromium clicks through package → paid order → delivery → payout and
      # requirement → quote → paid order (e2e/journeys.ts), then axe scans the
      # signed-in surfaces too (the ci.yml a11y job can only reach public pages).
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: pnpm --filter @amclub/web exec playwright install --with-deps chromium

      - name: Browser journeys (click-through, e2e/journeys.ts)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        working-directory: apps/web
        env:
          # Journey D (the corner assistant) needs the agent-on server; the rest run on :3000.
          AGENT_BASE_URL: ${{ steps.agentapp.outcome == 'success' && 'http://localhost:3001' || '' }}
        run: pnpm exec tsx e2e/journeys.ts

      - name: Accessibility (axe — every surface, signed in)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        working-directory: apps/web
        env:
          A11Y_ENFORCE: "1"
          A11Y_AGENT_BASE_URL: ${{ steps.agentapp.outcome == 'success' && 'http://localhost:3001' || '' }}
          A11Y_REPORT: ${{ github.workspace }}/apps/web/e2e-artifacts/a11y-report.json
        run: pnpm exec tsx scripts/a11y-scan.ts

      # Mart is live on production (MART_ENABLED=true since 2026-09-24), so its money path is proven on every PR
      # like the services one: M0 catalog → goods order → dispatch / delivery photos → release gate → payout,
      # returns and refund replay, M2 goods RFQ → quote → ordinary goods checkout, E16 storefront (attributes,
      # promises, ITC, samples, reorder), then the 0022–0025 / 0069 DB kill-tests. These run last: each suite removes
      # its own rows, and nothing here can then disturb the services journeys or the axe scan.
      - name: Mart acceptance (M0 goods lifecycle, M2 goods RFQ, E16 storefront, DB kill-tests — Mart on)
        if: ${{ !cancelled() && steps.agentapp.outcome == 'success' }}
        working-directory: apps/web
        env:
          BASE_URL: http://localhost:3001
        run: pnpm exec tsx scripts/mart-acceptance.ts

      - name: Mart kill switch (flag off on :3000 — no Mart surface exists)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec tsx scripts/mart-acceptance.ts --inert

      - name: Screenshots and a11y report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: apps/web/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: App log (on failure)
        if: failure()
        run: |
          tail -300 "$RUNNER_TEMP/next.log" || true
          echo "── production-flags app (:3001) ──"
          tail -150 "$RUNNER_TEMP/next-agent.log" || true
