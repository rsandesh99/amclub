name: CI

# Minutes economy (Actions is metered on this private repo): CI runs on a PR
# once it is ready for review — drafts run nothing — and not again on the merge
# push to master (the PR run already built the merged tree). A newer push
# cancels the older run. Run it on master by hand with workflow_dispatch.
on:
  pull_request:
    branches: [master, main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token (audit M26): nothing here writes to the repo or the PR.
permissions:
  contents: read

env:
  # Stub env vars so Next.js build doesn't fail on missing vars in CI.
  # Real secrets are injected only on deploy.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    # Minutes economy: drafts run nothing; a PR runs once when it is marked ready (and on later pushes).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        # Version comes from package.json's `packageManager` field — pinning it
        # here too makes action-setup@v4 fail on the mismatch.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm turbo run typecheck

      - name: Lint (all packages)
        run: pnpm turbo run lint

      # Offline: no non-Mart select / filter names a staged (0022–0025) column — the 2026-09-09
      # incident guard money-rigs.yml relies on (its header points here).
      - name: Mart static inertness (staged columns)
        run: pnpm --filter @amclub/web mart:static

      - name: Unit tests (shared — money, state machines, masking)
        run: pnpm --filter @amclub/shared test

      - name: Unit tests (agent-core — runner, confirm gate, budget, envelope)
        run: pnpm --filter @amclub/agent-core test

      - name: WhatsApp send path (ADR-030 — consent, STOP, window, ledger, error classes; offline)
        run: pnpm --filter @amclub/web whatsapp:verify

      - name: Component tests (mobile — Experience v3 E13 screens, jest-expo)
        run: pnpm --filter @amclub/mobile test

      - name: Language coverage (E14 — buying path in te / ta, live or pending review; ICU placeholders match English)
        run: pnpm --filter @amclub/web i18n:coverage

      - name: Prompt golden eval (agent-core — STUB mode, no key; includes the injection red-team set)
        run: pnpm --filter @amclub/agent-core eval

      # S2.1 — the red-team gate against the real models. Blocking, not advisory: runs whenever the
      # gateway key exists as a repo secret (the ai-golden.yml precedent); the family × prompt matrix
      # lands in the job summary.
      - name: Red-team gate key check
        id: redteam_key
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: echo "present=${{ env.KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Red-team gate (live)
        if: steps.redteam_key.outputs.present == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          pnpm --filter @amclub/agent-core eval -- --set injection --live 2>&1 | tee redteam.log
          { echo '### Red-team gate (live)'; echo; echo '\`\`\`'; grep -E "family|^  [a-z_]+ +[0-9-]|checks:|gate \(" redteam.log; echo '\`\`\`'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build (web)
        run: pnpm turbo run build --filter=@amclub/web
        env:
          # Disable Sentry source-map upload in CI — no auth token
          SENTRY_AUTH_TOKEN: ""

      - name: Export (mobile — bundle check, BLOCKING since Phase 8 §4)
        # NB: `exec` is required — `pnpm --filter x expo` looks for an "expo"
        # SCRIPT, finds none, and exits 0 without bundling anything (the
        # Phase 0 version of this step never actually ran).
        run: pnpm --filter @amclub/mobile exec expo export --platform android --output-dir /tmp/mobile-export

  a11y:
    name: Accessibility (axe — public surfaces)
    # Minutes economy: drafts run nothing; a PR runs once when it is marked ready (and on later pushes).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # BLOCKING since run 29016513054 went green (Phase 8 §1 rollout:
    # report-only first, flip once green).

    env:
      # Public client values (they ship in every browser bundle) — set as repo
      # Actions variables so CI pages render real catalog data. Public-only
      # scan: no service-role key in CI; authenticated surfaces are scanned
      # locally via the same script (see docs/A11Y.md).
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # supabase-js realtime needs native WebSocket → Node 22+.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @amclub/web exec playwright install --with-deps chromium

      - name: Build (web)
        run: pnpm turbo run build --filter=@amclub/web
        env:
          # Build-time placeholder only. The scan step must NOT see it, or the
          # scanner switches to full-auth mode and fails against a fake key.
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SENTRY_AUTH_TOKEN: ""

      - name: Start server & run axe scan
        env:
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key # server boot env-check only
        run: |
          pnpm --filter @amclub/web start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 2; done
          cd apps/web && A11Y_ENFORCE=1 SUPABASE_SERVICE_ROLE_KEY= BASE_URL=http://localhost:3000 npx tsx scripts/a11y-scan.ts
