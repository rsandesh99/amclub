# Phase 8 §6 — golden-set eval for the voice-RFQ parser.
#
# Needs a LIVE OpenRouter key (≈₹0.25/run on the default model), so it is NOT
# part of the main CI matrix:
#   - runs automatically on PRs that touch the parser/prompt/vocabulary/goldens
#     (this repo's "lib/ai" surface lives at apps/web/lib/voice)
#   - can be run manually from the Actions tab (workflow_dispatch)
#   - without the OPENROUTER_API_KEY secret the eval prints SKIPPED and
#     passes — add the secret (repo Settings → Secrets) to arm it.
name: AI golden eval

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/lib/voice/**'
      - 'packages/shared/src/specializations.ts'
      - 'packages/shared/src/categories.ts'
      - 'tests/ai-golden/**'
      - 'apps/web/scripts/eval-ai-golden.ts'

# Read-only token (audit M26).
permissions:
  contents: read

jobs:
  golden:
    name: Parser golden set (live LLM)
    # Minutes economy: drafts run nothing; a PR runs once when it is marked ready (and on later pushes).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run golden eval (skips without key)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VOICE_PARSE_MODEL: ${{ vars.VOICE_PARSE_MODEL }}
        run: pnpm --filter @amclub/web eval:golden
