# Fly.io config for the AMClub agent runtime (ADR-009 §1). ONE always-on machine
# in Mumbai (bom), close to the ap-south-1 Supabase. Rollback = scale to 0
# (docs/agents/RUNTIME.md). Enabling is a founder task (needs FLY_API_TOKEN).
app = "amc-agent-runtime"
primary_region = "bom"

[build]
  dockerfile = "apps/agent-runtime/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
