<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1B4D3E" />
<title>Offline — AMClub</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #FAFAF7; color: #1A1D1A; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; padding: 1.5rem; text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #1B4D3E; color: #fff; font-weight: 700; font-size: 26px; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 1.2rem; margin: .5rem 0 0; }
  p { margin: 0; color: #5C645C; font-size: .95rem; max-width: 26rem; }
  button { margin-top: 1rem; background: #1B4D3E; color: #fff; border: 0; border-radius: 10px; padding: .75rem 1.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">A</div>
  <!-- Static shell, outside the app's i18n runtime — bilingual by construction. -->
  <h1>You’re offline · आप ऑफ़लाइन हैं</h1>
  <p>Check your internet connection and try again. Your account pages open again once you are back online.</p>
  <p lang="hi">इंटरनेट कनेक्शन जांचें और फिर कोशिश करें। ऑनलाइन होते ही आपके खाते के पेज फिर से खुलेंगे।</p>
  <button onclick="location.reload()">Retry · फिर कोशिश करें</button>
</main>
</body>
</html>
